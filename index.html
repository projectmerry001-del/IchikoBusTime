<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小松市立高校 バス時刻案内</title>
  <style>
    :root {
      --primary: #1a365d;
      --accent: #2b6cb0;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: #333;
      margin: 0;
      padding: 12px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 1.15rem;
      margin: 0 0 12px 0;
      color: var(--primary);
      text-align: center;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: #e2e8f0;
      border-radius: 8px;
      font-weight: bold;
      color: #4a5568;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }
    .search-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      color: #4a5568;
    }
    input, select {
      padding: 8px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .status-badge {
      background: #ebf8ff;
      border-left: 4px solid var(--accent);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }
    .status-badge.alert {
      background: #fff5f5;
      border-left-color: #e53e3e;
      color: #c53030;
    }
    .bus-item {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .bus-item.recommend {
      border: 2px solid #319795;
      background-color: #e6fffa;
    }
    .bus-header {
      margin-bottom: 8px;
    }
    .bus-route {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .stop-info {
      font-size: 0.82rem;
      color: #4a5568;
      font-weight: bold;
    }
    .bus-time {
      font-size: 1.25rem;
      font-weight: bold;
      color: #1a202c;
      margin-top: 2px;
    }
    .bus-time span {
      font-size: 0.85rem;
      font-weight: normal;
      color: #718096;
    }
    .tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-right: 4px;
    }
    .tag-hokutetsu { background: #ebf8ff; color: #2b6cb0; }
    .tag-loop { background: #feebc8; color: #c05621; }
  </style>
</head>
<body>

<div class="card">
  <h1>小松市立高校 ⇔ 小松駅 バス時刻案内</h1>

  <!-- 方向切り替え -->
  <div class="tabs">
    <button class="tab-btn active" id="btnToSchool" onclick="setDirection('toSchool')">行き (小松駅発)</button>
    <button class="tab-btn" id="btnToStation" onclick="setDirection('toStation')">帰り (学校発)</button>
  </div>

  <!-- 日時指定条件 -->
  <div class="search-panel">
    <div class="input-group">
      <label>日付</label>
      <input type="date" id="searchDate" onchange="onConditionChange()">
    </div>
    <div class="input-group">
      <label>時刻</label>
      <input type="time" id="searchTime" onchange="onConditionChange()">
    </div>
  </div>

  <!-- ダイヤ判定バッジ -->
  <div id="statusBadge" class="status-badge"></div>

  <!-- バス一覧表示エリア -->
  <div id="busList"></div>
</div>

<script>

    { line: "市内循環(市民病院先行)", type: "loop", dep: "10:05", arr: "10:41", satSun: true, schoolHolidays: true },
    { line: "市内循環(市民病院先行)", type: "loop", dep: "13:55", arr: "14:31", satSun: true, schoolHolidays: true },

  toStation: [

    { line: "ハニベ線", type: "hokutetsu", dep: "08:36", arr: "08:48", satSun: false, schoolHolidays: true },
    { line: "ハニベ線", type: "hokutetsu", dep: "11:56", arr: "12:08", satSun: false, schoolHolidays: true },

    { line: "ハニベ線", type: "hokutetsu", dep: "16:41", arr: "16:53", satSun: false, schoolHolidays: true },
    { line: "ハニベ線", type: "hokutetsu", dep: "17:41", arr: "17:53", satSun: false, schoolHolidays: true },
    { line: "ハニベ線", type: "hokutetsu", dep: "18:31", arr: "18:43", satSun: false, schoolHolidays: true },

    // ハニベ線 (土日祝)
    { line: "ハニベ線", type: "hokutetsu", dep: "08:36", arr: "08:48", satSun: true, schoolHolidays: true },

    { line: "麦口線", type: "hokutetsu", dep: "07:37", arr: "07:49", satSun: false, schoolHolidays: true },

    { line: "麦口線", type: "hokutetsu", dep: "15:52", arr: "16:04", satSun: false, schoolHolidays: true },
    { line: "麦口線", type: "hokutetsu", dep: "16:48", arr: "17:00", satSun: false, schoolHolidays: true },
    { line: "麦口線", type: "hokutetsu", dep: "18:42", arr: "18:54", satSun: false, schoolHolidays: true },
    { line: "麦口線", type: "hokutetsu", dep: "19:14", arr: "19:28", satSun: false, schoolHolidays: true },

    // 麦口線 (土日祝)
    { line: "麦口線", type: "hokutetsu", dep: "10:52", arr: "11:04", satSun: true, schoolHolidays: true },

    { line: "市内循環(市民病院先行)", type: "loop", dep: "10:41", arr: "11:00", satSun: true, schoolHolidays: true },
    { line: "市内循環(市民病院先行)", type: "loop", dep: "14:31", arr: "14:50", satSun: true, schoolHolidays: true },

    { line: "市内循環(郵便局先行)", type: "loop", dep: "09:05", arr: "09:50", satSun: true, schoolHolidays: true },
    { line: "市内循環(郵便局先行)", type: "loop", dep: "11:40", arr: "12:25", satSun: true, schoolHolidays: true },
    { line: "市内循環(郵便局先行)", type: "loop", dep: "15:35", arr: "16:20", satSun: true, schoolHolidays: true },

  ]
};

let currentDirection = 'toSchool';

// ==========================================
// 2. 学休運休・土日祝日判定ロジック
// ==========================================
function isSchoolHoliday(date) {
  const m = date.getMonth() + 1;
  const d = date.getDate();
  if (m === 1 && d <= 7) return true;
  if ((m === 3 && d >= 25) || (m === 4 && d <= 6)) return true;
  if ((m === 7 && d >= 21) || m === 8) return true;
  if (m === 12 && d >= 25) return true;
  return false;
}

function getDayInfo(date) {
  const day = date.getDay();
  const isWeekend = (day === 0 || day === 6);
  const isHoliday = isSchoolHoliday(date);
  return { isWeekend, isHoliday };
}

function timeToMin(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  return h * 60 + m;
}

// ==========================================
// 3. 表示・検索処理
// ==========================================
function setDirection(dir) {
  currentDirection = dir;
  document.getElementById('btnToSchool').classList.toggle('active', dir === 'toSchool');
  document.getElementById('btnToStation').classList.toggle('active', dir === 'toStation');
  render();
}

function onConditionChange() {
  render();
}

function render() {
  const dateVal = document.getElementById('searchDate').value;
  const timeVal = document.getElementById('searchTime').value;
  
  if (!dateVal || !timeVal) return;

  const targetDate = new Date(dateVal + 'T' + timeVal);
  const dayInfo = getDayInfo(targetDate);
  const searchMin = timeToMin(timeVal);

  const badge = document.getElementById('statusBadge');
  let statusMsg = dayInfo.isWeekend ? "【土日祝ダイヤ】" : "【平日ダイヤ】";
  if (dayInfo.isHoliday) {
    statusMsg += " ⚠️学休期間中";
    badge.className = "status-badge alert";
  } else {
    badge.className = "status-badge";
  }
  badge.innerHTML = statusMsg;

  const rawList = busData[currentDirection];
  const validList = rawList.filter(bus => {
    if (dayInfo.isWeekend && !bus.satSun) return false;
    if (!dayInfo.isWeekend && bus.satSun && !isBothDaysBus(bus)) return false;
    if (dayInfo.isHoliday && !bus.schoolHolidays) return false;
    return true;
  });

  function isBothDaysBus(bus) {
    return !rawList.some(b => b.line === bus.line && b.dep === bus.dep && !b.satSun);
  }

  const upcomingList = validList
    .map(bus => ({ ...bus, depMin: timeToMin(bus.dep) }))
    .filter(bus => bus.depMin >= searchMin)
    .sort((a, b) => a.depMin - b.depMin);

  const listContainer = document.getElementById('busList');
  if (upcomingList.length === 0) {
    listContainer.innerHTML = `<div style="text-align:center; padding:20px; color:#a0aec0;">該当するバスはありません</div>`;
    return;
  }

  listContainer.innerHTML = upcomingList.map((bus, index) => {
    const isFirst = (index === 0);
    const tagClass = bus.type === 'hokutetsu' ? 'tag-hokutetsu' : 'tag-loop';

    let departureStop = '';
    let arrivalStop = '';

    if (currentDirection === 'toSchool') {
      // 行き：小松駅発
      departureStop = bus.type === 'loop' ? '小松駅③番のりば' : '小松駅②番のりば';
      arrivalStop = bus.type === 'loop' ? '八幡会館（学校まで徒歩8分）' : '市立高校前（学校まで徒歩2分）';
    } else {
      // 帰り：学校発
      departureStop = bus.type === 'loop' ? '八幡会館（学校から徒歩8分）' : '市立高校前（学校から徒歩2分）';
      arrivalStop = '小松駅';
    }

    return `
      <div class="bus-item ${isFirst ? 'recommend' : ''}">
        <div class="bus-header">
          <span class="tag ${tagClass}">${bus.line}</span>
          ${isFirst ? '<strong style="color:#319795; font-size:0.8rem;">[最先発]</strong>' : ''}
        </div>
        <div class="bus-route">
          <div>
            <div class="stop-info">${departureStop}</div>
            <div class="bus-time">${bus.dep} <span>発</span></div>
          </div>
          <div style="text-align: right;">
            <div class="stop-info">${arrivalStop}</div>
            <div class="bus-time">${bus.arr} <span>着</span></div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// 初期値セット（現在日時）
const now = new Date();
document.getElementById('searchDate').value = now.toISOString().split('T')[0];
document.getElementById('searchTime').value = now.toTimeString().slice(0, 5);
render();
</script>
</body>
</html>
